services:
  server:
    build: ./server
    environment:
      ConnectionStrings__Mongo: "mongodb://mongo:27017/collab"
      DataProtection__KeysPath: /keys
      ForwardedHeaders__Enabled: "true"
      # AI diagrams (optional): point at the LLM Gateway or any OpenAI-compatible API.
      Ai__BaseUrl: ${AI_BASE_URL:-}
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__Model: ${AI_MODEL:-gpt-4o-mini}
    volumes:
      - auth-keys:/keys
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - server

  mongo:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
  auth-keys:
