server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Basic hardening. Angular inlines some styles, hence 'unsafe-inline' for styles only.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  # The API and the real-time hub go to the .NET server, which learns the original scheme and client
  # address from the X-Forwarded-* headers (so cookies are marked Secure behind HTTPS).
  location /api/ {
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto$scheme_fallback;
    client_max_body_size 2m;
  }

  location /hubs/ {
    proxy_pass http://server:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto$scheme_fallback;
    proxy_read_timeout 1h;
  }

  # Hashed bundles never change; index.html always must be fresh.
  location ~* \.(js|css|woff2?|svg|png|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Client-side routes (/b/:id, /invite/:token) all serve the Angular app.
  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    try_files $uri $uri/ /index.html;
  }
}

# Keep the scheme a TLS-terminating proxy in front of us reported; otherwise use our own.
map $http_x_forwarded_proto $scheme_fallback {
  ""      $scheme;
  default "";
}
